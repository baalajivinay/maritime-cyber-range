<!DOCTYPE html>
<html>
<head>
    <title>Maritime Cyber Range — Live Monitor</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --blue:#2563eb; --red:#dc2626; --orange:#ea580c; --ok:#16a34a; --bg:#0f172a; --panel:#1e293b; --ink:#e2e8f0; --muted:#94a3b8; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; background: #0b1220; color: var(--ink); }
        header { background: var(--bg); padding: 12px 20px; display:flex; align-items:center; gap:14px; border-bottom:2px solid #1e293b; }
        header h1 { font-size: 18px; margin:0; letter-spacing:.3px; }
        header .sub { color: var(--muted); font-size: 13px; }
        .dot { width:10px; height:10px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); }
        .wrap { display:flex; gap:14px; padding:14px; height: calc(100vh - 52px); }
        #map { flex: 1; border-radius: 10px; overflow:hidden; min-width:0; }
        .side { width: 340px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; }
        .card { background: var(--panel); border-radius:10px; padding:14px; }
        .card h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:700; }
        .bignum { font-size:44px; font-weight:800; line-height:1; }
        .bignum small { font-size:16px; color:var(--muted); font-weight:600; }
        .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:700; }
        .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; font-size:13px; }
        .grid2 .k { color:var(--muted); }
        .legend div { display:flex; align-items:center; gap:8px; font-size:13px; margin:4px 0; }
        .sw { width:14px; height:14px; border-radius:3px; }
        #alerts { max-height: 260px; overflow-y:auto; }
        .alert { border-left:4px solid #334155; padding:5px 8px; margin:5px 0; background:#0b1220; border-radius:4px; font-size:12px; animation: flash .8s; }
        @keyframes flash { from { background:#3b2020; } to { background:#0b1220; } }
        .muted { color: var(--muted); }
    </style>
</head>
<body>
    <header>
        <span class="dot" id="conn"></span>
        <h1>🛰️ Maritime Cyber Range</h1>
        <span class="sub" id="vehicle">Live Monitor</span>
    </header>

    <div class="wrap">
        <div id="map"></div>
        <div class="side">
            <div class="card">
                <h3>GPS / Position spoof error</h3>
                <div class="bignum"><span id="err">0.0</span><small> m</small></div>
                <div class="muted" id="errnote" style="margin-top:6px;">true vs. believed position</div>
            </div>

            <div class="card">
                <h3>Vehicle telemetry</h3>
                <div class="grid2">
                    <div class="k">Mode</div><div id="mode">—</div>
                    <div class="k">Armed</div><div id="armed">—</div>
                    <div class="k">Speed</div><div id="speed">—</div>
                    <div class="k">Depth/Alt</div><div id="depth">—</div>
                </div>
            </div>

            <div class="card legend">
                <h3>Legend</h3>
                <div><span class="sw" style="background:var(--blue)"></span> True position (Gazebo ground truth)</div>
                <div><span class="sw" style="background:var(--red)"></span> Believed position (ArduPilot)</div>
                <div><span class="sw" style="background:var(--orange)"></span> AIS contacts</div>
            </div>

            <div class="card">
                <h3>Attack alerts <span id="alert_count" style="color:var(--red)">(0)</span></h3>
                <div id="alerts"><p class="muted">No attacks detected.</p></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        var HOME = [-33.724223, 150.679736];
        var map = L.map('map', {zoomControl:true}).setView(HOME, 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                    {maxZoom: 20, attribution: '© OpenStreetMap'}).addTo(map);

        function dot(color){ return L.divIcon({className:'', iconSize:[16,16], iconAnchor:[8,8],
            html:'<div style="width:16px;height:16px;border-radius:50%;background:'+color+
                 ';border:2px solid #fff;box-shadow:0 0 6px '+color+'"></div>'}); }

        var trueMarker = L.marker(HOME, {icon: dot('#2563eb'), zIndexOffset:1000}).bindTooltip('TRUE',{permanent:false}).addTo(map);
        var believedMarker = L.marker(HOME, {icon: dot('#dc2626'), zIndexOffset:1000}).bindTooltip('BELIEVED',{permanent:false}).addTo(map);
        var trueTrail = L.polyline([], {color:'#2563eb', weight:3, opacity:.7}).addTo(map);
        var believedTrail = L.polyline([], {color:'#dc2626', weight:3, opacity:.7, dashArray:'1,0'}).addTo(map);
        var connector = L.polyline([], {color:'#f59e0b', weight:2, dashArray:'6,6', opacity:.9}).addTo(map);
        var aisMarkers = {};

        var truePos = null, believedPos = null, centered = false;
        var TRAIL_MAX = 80;

        function metersBetween(a, b){
            if(!a||!b) return 0;
            var R=6371000, dLat=(b[0]-a[0])*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
            var lat=(a[0]+b[0])/2*Math.PI/180;
            var x=dLon*Math.cos(lat), y=dLat; return Math.sqrt(x*x+y*y)*R;
        }
        function pushTrail(line, latlng){
            var pts = line.getLatLngs(); pts.push(latlng);
            if(pts.length>TRAIL_MAX) pts.shift(); line.setLatLngs(pts);
        }
        function refreshError(){
            if(!truePos||!believedPos) return;
            var d = metersBetween(truePos, believedPos);
            var el = document.getElementById('err');
            el.textContent = d.toFixed(1);
            var spoofed = d > 5;
            el.style.color = spoofed ? '#dc2626' : '#16a34a';
            document.getElementById('errnote').textContent = spoofed ?
                '⚠ believed position DIVERGED from true' : 'true ≈ believed (nominal)';
            connector.setLatLngs([truePos, believedPos]);
        }

        var socket = io();
        socket.on('connect', function(){ document.getElementById('conn').style.background='#16a34a'; });
        socket.on('disconnect', function(){ document.getElementById('conn').style.background='#dc2626'; });

        socket.on('gps_true_update', function(d){
            truePos=[d.lat,d.lon]; trueMarker.setLatLng(truePos); pushTrail(trueTrail, truePos);
            if(!centered){ map.setView(truePos, 16); centered=true; }
            refreshError();
        });
        socket.on('gps_believed_update', function(d){
            if(d.lat===0 && d.lon===0) return;
            believedPos=[d.lat,d.lon]; believedMarker.setLatLng(believedPos); pushTrail(believedTrail, believedPos);
            refreshError();
        });
        socket.on('ais_update', function(d){
            var ll=[d.lat,d.lon];
            if(!aisMarkers[d.mmsi]) aisMarkers[d.mmsi]=L.marker(ll,{icon:dot('#ea580c')}).bindTooltip('AIS '+d.mmsi).addTo(map);
            else aisMarkers[d.mmsi].setLatLng(ll);
        });
        socket.on('status_update', function(s){
            if(s.vehicle) document.getElementById('vehicle').textContent = s.vehicle;
            if(s.mode!==undefined) document.getElementById('mode').textContent = s.mode;
            if(s.armed!==undefined){ var a=document.getElementById('armed');
                a.innerHTML = '<span class="tag" style="background:'+(s.armed?'#7f1d1d':'#14532d')+';color:#fff">'+(s.armed?'ARMED':'disarmed')+'</span>'; }
            if(s.speed!==undefined) document.getElementById('speed').textContent = s.speed.toFixed(2)+' m/s';
            if(s.depth!==undefined) document.getElementById('depth').textContent = s.depth.toFixed(2)+' m';
        });

        var alertCount=0;
        var alertColors={gps_spoof:'#ea580c', ais_spoof:'#8b5cf6', c2_replay:'#dc2626', acoustic_spoof:'#2563eb'};
        socket.on('attack_alert', function(a){
            if(alertCount===0) document.getElementById('alerts').innerHTML='';
            alertCount++; document.getElementById('alert_count').textContent='('+alertCount+')';
            var t=new Date(a.t*1000).toLocaleTimeString();
            var row=document.createElement('div'); row.className='alert';
            row.style.borderLeftColor = alertColors[a.attack_type]||'#334155';
            row.innerHTML='<strong style="color:'+(alertColors[a.attack_type]||'#fff')+'">'+a.attack_type.toUpperCase()+
                          '</strong> <span class="muted">'+t+'</span><br>'+a.detail;
            var box=document.getElementById('alerts'); box.insertBefore(row, box.firstChild);
        });
    </script>
</body>
</html>
