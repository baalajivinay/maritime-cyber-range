<!DOCTYPE html>
<html>
<head>
    <title>WAM-V GPS Monitor</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; display: flex; gap: 20px; }
        #map { height: 600px; width: 800px; }
        #info { padding: 20px; background: #f0f0f0; border-radius: 5px; min-width: 250px; }
        .controls { margin-top: 20px; padding-top: 10px; border-top: 1px solid #ccc; }
        .control-item { margin-bottom: 5px; }
    </style>
</head>
<body>
    <div>
        <h2>WAM-V Live Position</h2>
        <div id="map"></div>
    </div>
    <div id="info">
        <h3>Current Data</h3>
        <p><strong>Lat:</strong> <span id="lat">Waiting...</span></p>
        <p><strong>Lon:</strong> <span id="lon">Waiting...</span></p>
        <p><strong>Time:</strong> <span id="time">Waiting...</span></p>
        <p><strong>Lag (ms):</strong> <span id="lag">Waiting...</span></p>
        
        <div class="controls">
            <h4>Layers</h4>
            <div class="control-item">
                <input type="checkbox" id="layer_true" checked>
                <label for="layer_true">True Position (Gazebo)</label>
            </div>
            <div class="control-item">
                <input type="checkbox" id="layer_believed" checked>
                <label for="layer_believed">ArduPilot Believes</label>
            </div>
            <div class="control-item">
                <input type="checkbox" id="layer_ais" checked>
                <label for="layer_ais">AIS Contacts</label>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        var map = L.map('map').setView([-33.724223, 150.679736], 18);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 22,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Icon definitions
        var blueIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        var redIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        var aisIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        // Layer Groups
        var trueLayer = L.layerGroup().addTo(map);
        var believedLayer = L.layerGroup().addTo(map);
        var aisLayer = L.layerGroup().addTo(map);

        // Checkbox events
        document.getElementById('layer_true').addEventListener('change', function(e) {
            if (e.target.checked) { map.addLayer(trueLayer); } else { map.removeLayer(trueLayer); }
        });
        document.getElementById('layer_believed').addEventListener('change', function(e) {
            if (e.target.checked) { map.addLayer(believedLayer); } else { map.removeLayer(believedLayer); }
        });
        document.getElementById('layer_ais').addEventListener('change', function(e) {
            if (e.target.checked) { map.addLayer(aisLayer); } else { map.removeLayer(aisLayer); }
        });

        // Markers
        var trueMarker = L.marker([-33.724223, 150.679736], {icon: blueIcon}).bindPopup("True Position (Gazebo)").addTo(trueLayer);
        var believedMarker = L.marker([-33.724223, 150.679736], {icon: redIcon}).bindPopup("ArduPilot Believes").addTo(believedLayer);
        var aisMarkers = {};

        var socket = io();
        
        socket.on('gps_true_update', function(data) {
            var absolute_now = Date.now();
            var server_ts_ms = data.server_recv_time * 1000;
            var lag_ms = absolute_now - server_ts_ms;
            
            document.getElementById('lat').innerText = data.lat.toFixed(6);
            document.getElementById('lon').innerText = data.lon.toFixed(6);
            document.getElementById('time').innerText = data.timestamp;
            document.getElementById('lag').innerText = lag_ms.toFixed(2);
            
            var newLatLng = new L.LatLng(data.lat, data.lon);
            trueMarker.setLatLng(newLatLng);
            map.setView(newLatLng, map.getZoom(), { animate: false });
        });

        socket.on('gps_believed_update', function(data) {
            var newLatLng = new L.LatLng(data.lat, data.lon);
            believedMarker.setLatLng(newLatLng);
        });

        socket.on('ais_update', function(data) {
            var newLatLng = new L.LatLng(data.lat, data.lon);
            if (!aisMarkers[data.mmsi]) {
                aisMarkers[data.mmsi] = L.marker(newLatLng, {icon: aisIcon}).bindPopup("AIS: " + data.mmsi).addTo(aisLayer);
            } else {
                aisMarkers[data.mmsi].setLatLng(newLatLng);
            }
        });
    </script>
</body>
</html>
